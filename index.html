<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07111f" />
    <title>Plan Graph</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="appShell" class="app-shell">
      <header id="topbar" class="topbar">
        <div class="topbar__left">
          <div class="eyebrow">Plan Graph</div>
          <h1 id="appTitle">Ecosystem Interactive Control & Living Architecture Hub</h1>
          <p id="appSubtitle">Schema-driven D3 canvas and multi-section project drawer.</p>
        </div>
        <div class="topbar__center" id="healthCluster"></div>
        <div class="topbar__process" aria-label="Scenario controls">
          <label for="scenarioSelect">Scenario</label>
          <select id="scenarioSelect" aria-label="Scenario"></select>
          <div class="mode-toggle" role="group" aria-label="Visualization mode">
            <button id="demoModeButton" class="mode-button active" type="button">Demo</button>
            <button id="liveModeButton" class="mode-button" type="button">Live</button>
          </div>
          <div class="process-buttons" role="group" aria-label="Scenario controls">
            <button id="restartScenarioButton" class="icon-button" type="button" title="Restart" aria-label="Restart">↺</button>
            <button id="previousStepButton" class="icon-button" type="button" title="Previous step" aria-label="Previous step">⏮</button>
            <button id="playPauseButton" class="primary process-play" type="button">Play</button>
            <button id="nextStepButton" class="icon-button" type="button" title="Next step" aria-label="Next step">⏭</button>
          </div>
          <label class="speed-control" for="scenarioSpeedSelect">Speed</label>
          <select id="scenarioSpeedSelect" aria-label="Scenario speed">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
          </select>
        </div>
        <div class="topbar__right">
          <div class="set-switcher">
            <label for="setSelect">Network</label>
            <select id="setSelect" aria-label="Project network"></select>
          </div>
          <button id="refreshButton" class="ghost">Reload</button>
          <button id="addProjectButton" class="primary">Add Project/Agent</button>
        </div>

      </header>


      <section id="processVisualization" class="process-visualization" aria-label="Process continuation">
        <div id="stepExplanation" class="step-explanation"></div>
      </section>

      <div id="topSplitter" class="top-splitter" role="separator" aria-orientation="horizontal" aria-label="Resize the upper panel"></div>

      <main class="workspace">
        <section class="graph-panel graph-panel--compass">
          <div class="graph-panel__header">
            <div>
              <div class="panel-kicker">D3 Canvas</div>
              <h2>Compass Network</h2>
            </div>
            <div class="panel-hint">Compass center with self_manager, assessment, administrative, and connected projects.</div>
            <div id="graphFlowSummary" class="graph-flow-summary" aria-label="Project connections summary"></div>
          </div>
          <div id="graphViewport" class="graph-viewport">
            <svg id="graphSvg" aria-label="Compass network graph"></svg>
            <div id="tooltip" class="tooltip" hidden></div>
          </div>
        </section>
      </main>

      <div id="splitter" class="splitter" role="separator" aria-orientation="vertical" aria-label="Resize graph and drawer" tabindex="0"></div>

      <aside id="drawer" class="drawer" aria-hidden="true">
        <div class="drawer__shell">
          <div class="drawer__head">
            <div>
              <div id="drawerMode" class="drawer__mode">Project</div>
              <h2 id="drawerTitle">Select a project</h2>
              <div class="drawer__meta"><span id="drawerRevision">—</span> · <span id="drawerBaseRevision">—</span></div>
            </div>
            <button id="closeDrawerButton" class="ghost">Hide</button>
          </div>

          <div class="drawer__tabs" id="drawerTabs">
            <button class="tab active" data-section="overview">Overview</button>
            <button class="tab" data-section="identity_and_role">Identity</button>
            <button class="tab" data-section="interfaces_and_flows">Flows</button>
            <button class="tab" data-section="scheduler">Scheduler</button>
            <button class="tab" data-section="roadmap_and_tasks">Tasks</button>
            <button class="tab" data-section="docs">Docs</button>
            <button class="tab" data-section="export_and_commit">Export</button>
          </div>

          <div id="drawerBody" class="drawer__body"></div>

          <div class="drawer__footer">
            <div class="drawer__status">
              <div id="validationSummary" class="summary"></div>
              <pre id="patchPreview" class="patch-preview"></pre>
            </div>
            <div class="drawer__actions">
              <button id="saveButton" class="primary">Save &amp; Export</button>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <script src="vendor/d3.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
